name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "nightly-*"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -p no:cacheprovider tests/ -q

      - name: Build SceneAccess.exe
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --collect-all accessible_output2
          --collect-all imageio_ffmpeg --collect-all yt_dlp_ejs
          --name SceneAccess --paths . SceneAccess.py

      - name: Assemble source and Windows application
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "SceneAccess"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $sourceArchive = Join-Path $env:RUNNER_TEMP "sceneaccess-source.zip"
          git archive --format=zip --output $sourceArchive HEAD
          Expand-Archive -Path $sourceArchive -DestinationPath $package -Force
          Copy-Item "dist\SceneAccess\*" -Destination $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "dist\SceneAccess-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SceneAccess-windows-x64
          path: dist/SceneAccess-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/SceneAccess-windows-x64.zip
          --title "SceneAccess ${{ github.ref_name }}" --generate-notes --verify-tag

      # nightly-YYYY-MM-DD tags publish a pre-release, so they never appear as the latest stable version.
      - name: Publish nightly pre-release
        if: startsWith(github.ref, 'refs/tags/nightly-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/SceneAccess-windows-x64.zip
          --title "SceneAccess ${{ github.ref_name }}" --generate-notes --verify-tag --prerelease
